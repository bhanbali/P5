<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landscape 360 VR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #171b18;
      font-family: sans-serif;
    }
    #vr-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 18px 40px;
      background: #00c853;
      color: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 12px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      z-index: 99999;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    #msg {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      color: #ff5555;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      display: none;
      z-index: 100000;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="msg"></div>
  <button id="vr-btn">ENTER 360 VR</button>

  <script>
    const msgBox = document.getElementById('msg');
    const vrBtn = document.getElementById('vr-btn');

    function showError(err) {
      msgBox.style.display = 'block';
      msgBox.textContent = err;
    }

    // 1. SETUP THREE.JS 360 SCENE
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171b18);
    scene.fog = new THREE.FogExp2(0x171b18, 0.05);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 100);
    const userRig = new THREE.Group();
    userRig.position.set(0, 1.5, 0); // Position player at center
    userRig.add(camera);
    scene.add(userRig);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. PROCEDURAL 360 LANDSCAPE PARTICLES
    const layerHeights = [-1.15, -0.60, 0, 0.75, 1.45];
    const layerDepths  = [-1.70, -0.90, 0, 0.85, 1.65];
    const layerSizes   = [1.8, 1.4, 1.0, 1.1, 0.75];
    const layerColors  = [
      [48 / 255, 67 / 255, 48 / 255],
      [75 / 255, 96 / 255, 65 / 255],
      [112 / 255, 119 / 255, 83 / 255],
      [143 / 255, 119 / 255, 87 / 255],
      [83 / 255, 72 / 255, 57 / 255]
    ];
    const layerCounts  = [700, 850, 1100, 800, 750];
    const centers = [
      [-1.15, -0.35, 0],
      [0.80, -0.75, 0.45],
      [1.20, 0.40, -0.35],
      [-0.70, 0.70, 0.45]
    ];

    const particleData = [];
    const positions = [];
    const colors = [];
    const S = 0.025;

    for (let layer = 0; layer < 5; layer++) {
      for (let i = 0; i < layerCounts[layer]; i++) {
        const fragment = Math.floor(Math.random() * 4);
        const center = centers[fragment];
        const spread = layerSizes[layer];
        const angle = Math.random() * Math.PI * 2;
        const distFromCenter = Math.sqrt(Math.random()) * 75 * spread * S;

        const x = center[0] * spread + Math.cos(angle) * distFromCenter;
        const z = center[2] * spread + Math.sin(angle) * distFromCenter + layerDepths[layer];

        const origX = x / S;
        const origZ = z / S;
        const terrain = (
          Math.sin(origX * 0.025) * 13 +
          Math.cos(origZ * 0.03) * 12 +
          Math.sin((origX + origZ) * 0.025) * 8
        ) * S;

        const y = center[1] * spread + terrain + layerHeights[layer];
        const detachedChance = (layer === 3) ? 0.10 : (layer === 4 ? 0.25 : 0.05);
        const shade = 0.8 + Math.random() * 0.4;
        const baseCol = layerColors[layer];

        particleData.push({
          origX: x, origY: y, origZ: z,
          driftX: (Math.random() - 0.5) * 0.003,
          driftY: (Math.random() - 0.5) * 0.002,
          driftZ: (Math.random() - 0.5) * 0.003,
          detached: Math.random() < detachedChance
        });

        positions.push(x, y, z);
        colors.push(baseCol[0] * shade, baseCol[1] * shade, baseCol[2] * shade);
      }
    }

    const geometry = new THREE.BufferGeometry();
    const posAttr = new THREE.Float32BufferAttribute(positions, 3);
    geometry.setAttribute('position', posAttr);
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.035, vertexColors: true, transparent: true, opacity: 0.9 });
    const terrainCloud = new THREE.Points(geometry, material);
    terrainCloud.position.set(0, 1.5, 0);
    scene.add(terrainCloud);

    // 3. RENDER LOOP
    let frame = 0;
    renderer.setAnimationLoop(() => {
      frame++;
      const posArray = posAttr.array;
      for (let i = 0; i < particleData.length; i++) {
        const p = particleData[i];
        const idx = i * 3;
        if (p.detached) {
          posArray[idx]     += p.driftX;
          posArray[idx + 1] += p.driftY;
          posArray[idx + 2] += p.driftZ;
        } else {
          posArray[idx]     = p.origX + Math.sin(frame * 0.008 + p.origY * 10) * 0.025;
          posArray[idx + 1] = p.origY + Math.sin(frame * 0.010 + p.origZ * 10) * 0.038;
          posArray[idx + 2] = p.origZ + Math.cos(frame * 0.008 + p.origX * 10) * 0.025;
        }
      }
      posAttr.needsUpdate = true;
      renderer.render(scene, camera);
    });

    // 4. DIRECT USER CLICK ACTIVATION (Guaranteed for Quest 3)
    vrBtn.addEventListener('click', async () => {
      if (!navigator.xr) {
        showError("WebXR is not available. Ensure you are inside the native Meta Quest Browser application.");
        return;
      }

      try {
        // Direct request with safe fallback feature list
        const session = await navigator.xr.requestSession('immersive-vr', {
          optionalFeatures: ['local-floor', 'bounded-floor', 'local']
        });

        await renderer.xr.setSession(session);
        vrBtn.style.display = 'none';
        msgBox.style.display = 'none';
      } catch (err) {
        showError("Error starting VR: " + err.message + "\nIf on Quest, ensure boundary tracking is active.");
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
