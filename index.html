<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Landscape 360 VR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #171b18;
      font-family: sans-serif;
    }
    #vr-btn {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: #0084ff;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 9999;
    }
    #error-status {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      color: #ffb3b3;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      display: none;
      z-index: 10000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="error-status"></div>
  <button id="vr-btn">CHECKING VR...</button>

    const statusBox = document.getElementById('error-status');
    const vrBtn = document.getElementById('vr-btn');

    function showError(msg) {
      statusBox.style.display = 'block';
      statusBox.textContent = msg;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171b18);
    scene.fog = new THREE.FogExp2(0x171b18, 0.05);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 100);

    const userRig = new THREE.Group();
    userRig.position.set(0, 1.5, 0); // Natural eye height
    userRig.add(camera);
    scene.add(userRig);

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
