<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Underwater VR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #defaultCanvas0 { display: none; } /* Hide the 2D p5 canvas; Three.js displays it in VR */
    #vr-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>
  <button id="vr-btn">ENTER VR</button>
  <script src="sketch.js"></script>
  <script src="xr_harness.js"></script>
</body>
</html>
