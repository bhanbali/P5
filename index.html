<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 VR Landscape</title>

  <!-- Load Three.js and the official VRButton helper -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #171b18;
      font-family: monospace;
    }
    /* Always visible status/diagnostic bar at top */
    #status-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff66;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10000;
      pointer-events: none;
      white-space: pre-line;
    }
    /* Fallback manual button if official VRButton fails to append */
    #manual-vr-btn {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: #0084ff;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="status-bar">Checking WebXR status...</div>
  <button id="manual-vr-btn">ENTER 360 VR</button>

  <script>
    const statusBar = document.getElementById('status-bar');
    const manualBtn = document.getElementById('manual-vr-btn');

    function log(msg) {
      statusBar.textContent += "\n" + msg;
      console.log(msg);
    }

    // --- 1. THREE.JS 360 ENVIRONMENT ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171b18);
    scene.fog = new THREE.FogExp2(0x171b18, 0.05);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 100);
    const userRig = new THREE.Group();
    userRig.position.set(0, 1.5, 0);
    userRig.add(camera);
    scene.add(userRig);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Try adding Three's official VRButton
    try {
      const officialBtn = VRButton.createButton(renderer);
      document.body.appendChild(officialBtn);
      // If official button loaded, hide the fallback manual button
      manualBtn.style.display = 'none';
      log("[OK] Official Three.js VRButton initialized.");
    } catch (e) {
      log("[WARN] Official VRButton failed to attach. Using manual button fallback.");
    }

    // --- 2. 360 PARTICLES SETUP ---
    const layerHeights = [-1.15, -0.60, 0, 0.75, 1.45];
    const layerDepths  = [-1.70, -0.90, 0, 0.85, 1.65];
    const layerSizes   = [1.8, 1.4, 1.0, 1.1, 0.75];
    const layerColors = [
      [48 / 255, 67 / 255, 48 / 255],
      [75 / 255, 96 / 255, 65 / 255],
      [112 / 255, 119 / 255, 83 / 255],
      [143 / 255, 119 / 255, 87 / 255],
      [83 / 255, 72 / 255, 57 / 255]
    ];
    const layerCounts = [700, 850, 1100, 800, 750];
    const centers = [
      [-1.15, -0.35, 0],
      [0.80, -0.75, 0.45],
      [1.20, 0.40, -0.35],
      [-0.70, 0.70, 0.45]
    ];

    const particleData = [];
    const positions = [];
    const colors = [];
    const S = 0.025;

    for (let layer = 0; layer < 5; layer++) {
      for (let i = 0; i < layerCounts[layer]; i++) {
        const fragment = Math.floor(Math.random() * 4);
        const center = centers[fragment];
        const spread = layerSizes[layer];
        const angle = Math.random() * Math.PI * 2;
        const distFromCenter = Math.sqrt(Math.random()) * 75 * spread * S;

        const x = center[0] * spread + Math.cos(angle) * distFromCenter;
        const z = center[2] * spread + Math.sin(angle) * distFromCenter + layerDepths[layer];

        const origX = x / S;
        const origZ = z / S;
        const terrain = (
          Math.sin(origX * 0.025) * 13 +
          Math.cos(origZ * 0.03) * 12 +
          Math.sin((origX + origZ) * 0.025) * 8
        ) * S;

        const y = center[1] * spread + terrain + layerHeights[layer];

        let detachedChance = (layer === 3) ? 0.10 : (layer === 4 ? 0.25 : 0.05);
        const shade = 0.8 + Math.random() * 0.4;
        const baseCol = layerColors[layer];

        particleData.push({
          origX: x, origY: y, origZ: z,
          driftX: (Math.random() - 0.5) * 0.003,
          driftY: (Math.random() - 0.5) * 0.002,
          driftZ: (Math.random() - 0.5) * 0.003,
          detached: Math.random() < detachedChance
        });

        positions.push(x, y, z);
        colors.push(baseCol[0] * shade, baseCol[1] * shade, baseCol[2] * shade);
      }
    }

    const geometry = new THREE.BufferGeometry();
    const posAttr = new THREE.Float32BufferAttribute(positions, 3);
    geometry.setAttribute('position', posAttr);
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.035, vertexColors: true, transparent: true, opacity: 0.9 });
    const terrainCloud = new THREE.Points(geometry, material);
    terrainCloud.position.set(0, 1.5, 0);
    scene.add(terrainCloud);

    // --- 3. ANIMATION LOOP ---
    let frame = 0;
    renderer.setAnimationLoop(() => {
      frame++;
      const posArray = posAttr.array;
      for (let i = 0; i < particleData.length; i++) {
        const p = particleData[i];
        const idx = i * 3;
        if (p.detached) {
          posArray[idx]     += p.driftX;
          posArray[idx + 1] += p.driftY;
          posArray[idx + 2] += p.driftZ;
        } else {
          posArray[idx]     = p.origX + Math.sin(frame * 0.008 + p.origY * 10) * 0.025;
          posArray[idx + 1] = p.origY + Math.sin(frame * 0.010 + p.origZ * 10) * 0.038;
          posArray[idx + 2] = p.origZ + Math.cos(frame * 0.008 + p.origX * 10) * 0.025;
        }
      }
      posAttr.needsUpdate = true;
      renderer.render(scene, camera);
    });

    // --- 4. MANUAL VR BUTTON BACKUP (Always clickable) ---
    manualBtn.addEventListener('click', async () => {
      if (!navigator.xr) {
        alert("WebXR API is not supported in this browser. Please open in Meta Quest Browser.");
        return;
      }
      try {
        const session = await navigator.xr.requestSession('immersive-vr', {
          optionalFeatures: ['local-floor', 'local', 'viewer']
        });
        await renderer.xr.setSession(session);
        manualBtn.style.display = 'none';
        statusBar.style.display = 'none';
      } catch (err) {
        log("[ERROR] Failed to start VR: " + err.message);
      }
    });

    // Diagnostics check
    if (!navigator.xr) {
      log("[FAIL] navigator.xr is not found. Are you in a VR browser?");
    } else {
      navigator.xr.isSessionSupported('immersive-vr').then(supported => {
        log(supported ? "[OK] 'immersive-vr' supported by headset." : "[FAIL] 'immersive-vr' reported NOT supported.");
      });
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
